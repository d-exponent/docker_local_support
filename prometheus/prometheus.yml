global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nca-rest-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9000"]
        labels:
          service: rest-api

  - job_name: "rnca-ealtime"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9001"]
        labels:
          service: realtime