global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nca-rest-api"
    static_configs:
      - targets: ["host.docker.internal:2112"]
        labels:
          service: rest-api

  - job_name: "nca-realtime"
    static_configs:
      - targets: ["host.docker.internal:2113"]   
        labels:
          service: realtime